<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK EasyLife - 本地極速生活服務配對平台</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            color: #1d3557;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .service-box {
            background: #e8f4f8;
            border-left: 4px solid #1d3557;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .service-box h3 {
            margin-top: 0;
            color: #1d3557;
            font-size: 1rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2b2b2b;
        }
        input[type="text"], input[type="tel"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .notice-tag {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .btn-submit {
            background-color: #25D366; /* WhatsApp 綠 */
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #1ebe5d;
        }
        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
        }
        .footer-links a {
            color: #457b9d;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡️ HK EasyLife 快速服務預約</h2>
        <p class="subtitle">全港首創 • 實名認證 • 嚴格私隱保障</p>

        <!-- 服務特色與安全聲明 -->
        <div class="service-box">
            <h3>📌 核心服務與安全守則：</h3>
            <ul style="padding-left: 20px; margin: 0;">
                <li><strong>專業項目</strong>：放狗服務、日常跑腿、傢俬組裝、健身陪練 (Gym Buddy)。</li>
                <li><strong>🔒 健身陪練安全條例</strong>：如選擇女性 Gym Buddy，<strong>嚴格只限同性陪練</strong>，確保雙方私隱與安全；男性陪練員人才充足，更享彈性優惠收費！</li>
                <li><strong>實名認證</strong>：所有上線夥伴均經雙證件（身分證+地址證明）防偽水印審核，安心可靠。</li>
            </ul>
        </div>

        <form id="orderForm" onsubmit="handleOrderSubmit(event)">
            <div class="form-group">
                <label for="cName">您的稱呼：</label>
                <input type="text5" id="cName" required placeholder="例如：張小姐 / 陳先生">
            </div>

            <div class="form-group" style="display:none;"></div> <!-- 保持排版 -->

            <div class="form-group">
                <label for="cPhone">聯絡電話 (WhatsApp)：</label>
                <input type="tel" id="cPhone" required placeholder="例如：91234567">
            </div>

            <div class="form-group">
                <label for="cService">所需服務：</label>
                <select id="cService">
                    <option value="健身陪練 (Gym Buddy - 男性陪練/優惠價)">💪 健身陪練 (Gym Buddy - 男性陪練 / 優惠價)</option>
                    <option value="健身陪練 (Gym Buddy - 女性陪練/嚴格同性)">💪 健身陪練 (Gym Buddy - 女性陪練 / 嚴格同性)</option>
                    <option value="寵物散步 / 放狗">🐕 寵物散步 / 放狗服務</option>
                    <option value="日常跑腿 / 排隊">🏃‍♂️ 日常跑腿 / 排隊服務</option>
                    <option value="傢俬組裝 / 家居幫手">🛠️ 傢俬組裝 / 家居幫手</option>
                </select>
            </div>

            <div class="notice-tag">
                💡 <strong>提示</strong>：提交後系統將自動跳轉至 WhatsApp（97821811）與專員直接對接確認細節。
            </div>

            <div class="form-group">
                <label for="cDetails">服務需求詳情（地區、時間、具體要求）：</label>
                <textarea id="cDetails" required placeholder="例如：九龍灣 24/7 Fitness，希望搵男教練幫手睇位，本週二下午 2 點..."></textarea>
            </div>

            <button type="submit" class="btn-submit">💬 透過 WhatsApp 確認預約</button>
        </form>

        <div class="footer-links">
            <p>如果你想加入成為合作夥伴？<a href="partner.html" target="_blank">👉 點此前往夥伴認證中心</a></p>
        </div>
    </div>

    <script>
        function handleOrderSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            const service = document.getElementById('cService').value;
            const details = document.getElementById('cDetails').value;

            const text = `您好！我想預約 HK EasyLife 服務：%0A` +
                         `• 服務項目：${service}%0A` +
                         `• 客戶稱呼：${name}%0A` +
                         `• 聯絡電話：${phone}%0A` +
                         `• 需求詳情：${details}`;

            // 跳轉到商用 WhatsApp (97821811)
            window.open(`https://wa.me/85297821811?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
