<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK EasyLife - 合作夥伴認證中心</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .logo-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-badge {
            display: inline-block;
            background: #1d3557;
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        h2 { color: #1d3557; text-align: center; }
        p.subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .top-nav { text-align: center; margin-bottom: 25px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
        .top-nav a { color: #457b9d; text-decoration: none; font-weight: bold; margin: 0 10px; font-size: 0.9rem; }
        .top-nav a:hover { text-decoration: underline; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.95rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .notice-box { background: #e8f4f8; padding: 12px; border-left: 4px solid #1d3557; font-size: 0.85rem; margin-bottom: 15px; border-radius: 4px; }
        .btn-submit { background-color: #1d3557; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #112240; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 品牌 Logo 徽章 -->
        <div class="logo-header">
            <div class="logo-badge">🛡️ HK EasyLife</div>
        </div>

        <h2>夥伴認證中心</h2>
        <p class="subtitle">實名審核 • 精準調度 • 安全保障</p>

        <!-- 導航列 -->
        <div class="top-nav">
            <a href="index.html">🏠 客戶預約首頁</a> | 
            <a href="partner.html">🤝 夥伴認證中心</a> | 
            <a href="faq.html">❓ 常見問題 (FAQ)</a>
        </div>

        <div class="notice-box">
            📌 <strong>夥伴招募須知</strong>：為確保配對質素，請填寫您的常駐區域、擅長範疇（如健身、陪伴、跑腿等），並上傳證件防水印及狀態參考照，方便平台為您精準分派高質量訂單！
        </div>

        <form id="partnerForm" onsubmit="handlePartnerSubmit(event)">
            <div class="form-group">
                <label>真實姓名 / 稱呼：</label>
                <input type="text" id="pName" required placeholder="例如：陳先生 / David">
            </div>

            <div class="form-group">
                <label>聯絡電話 (WhatsApp)：</label>
                <input type="tel" id="pPhone" required placeholder="例如：91234567">
            </div>

            <div class="form-group">
                <label>常駐區域（例如：觀塘、荃灣、旺角）：</label>
                <input type="text" id="pArea" required placeholder="例如：觀塘 / 九龍東">
            </div>

            <div class="form-group">
                <label>擅長接單類型（可多選填寫）：</label>
                <input type="text" id="pSkills" placeholder="例如：健身陪練, 遊戲陪伴, 戶外放狗, 日常跑腿等">
            </div>

            <div class="form-group">
                <label>上載證件防偽水印 (HKID / 地址證明)：</label>
                <input type="file" id="pDoc" accept="image/*" required>
                <small style="color: #666; font-size: 0.8rem;">*系統將自動加上「For EasyLife Verification Only」防偽水印以保障私隱[cite: 1, 2]。</small>
            </div>

            <div class="form-group">
                <label>上載近期狀態參考照 / 運動照（供配對審核）：</label>
                <input type="file" id="pPhoto" accept="image/*" required>
                <small style="color: #666; font-size: 0.8rem;">*讓客仔了解您的風格與水準，提升配對成功率。</small>
            </div>

            <button type="submit" class="btn-submit">🚀 提交審核資料並對接 WhatsApp</button>
        </form>
    </div>

    <script>
        function handlePartnerSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const phone = document.getElementById('pPhone').value;
            const area = document.getElementById('pArea').value;
            const skills = document.getElementById('pSkills').value;

            const text = `您好！我想申請成為 HK EasyLife 合作夥伴：%0A` +
                         `• 姓名：${name}%0A` +
                         `• 電話：${phone}%0A` +
                         `• 常駐區：${area}%0A` +
                         `• 擅長範疇：${skills}%0A` +
                         `*(註：證件及狀態照已準備好，請指示後續交收)*`;

            window.open(`https://wa.me/85297821811?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
